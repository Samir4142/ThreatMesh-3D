  <text x="1357" y="272" fill="#6d28d9" font-size="11" text-anchor="middle">Loaded once at startup</text>
  <text x="1357" y="288" fill="#6d28d9" font-size="11" text-anchor="middle">and kept in memory.</text>
  <text x="1357" y="310" fill="#6d28d9" font-size="11" text-anchor="middle">Sent in every classifier</text>
  <text x="1357" y="326" fill="#6d28d9" font-size="11" text-anchor="middle">and verifier prompt.</text>
  <text x="1357" y="348" fill="#6d28d9" font-size="11" text-anchor="middle">Technique IDs are checked</text>
  <text x="1357" y="364" fill="#6d28d9" font-size="11" text-anchor="middle">against this list.</text>

