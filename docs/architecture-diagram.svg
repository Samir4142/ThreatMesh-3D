  <text x="430" y="278" fill="#64748b" font-size="11" text-anchor="middle">Up To 40 KEV CVEs Per Cycle</text>

  <path d="M235 165 H265" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M275 257 H295" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>

