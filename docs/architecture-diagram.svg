  <text x="185" y="661" fill="#15803d" font-size="11" text-anchor="middle">Edges: Connecting Lines</text>
  <text x="185" y="677" fill="#15803d" font-size="11" text-anchor="middle">Click Node → CVE Panel</text>

  <rect x="355" y="600" width="290" height="90" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1.5"/>
  <text x="500" y="627" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">CVE Detail Panel</text>
  <text x="500" y="645" fill="#15803d" font-size="11" text-anchor="middle">Full Threat Detail + Attack Chain</text>
  <text x="500" y="661" fill="#15803d" font-size="11" text-anchor="middle">Confidence / Evidence Badges</text>
  <text x="500" y="677" fill="#15803d" font-size="11" text-anchor="middle">Verifier Confirmed / Revised Label</text>

