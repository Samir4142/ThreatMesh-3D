  <text x="620" y="170" fill="#64748b" font-size="11" text-anchor="middle">Rolling Delta (Capped 2h Window)</text>
  <text x="620" y="186" fill="#64748b" font-size="11" text-anchor="middle">Recent / Modified CVEs</text>

  <rect x="55" y="225" width="220" height="65" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="165" y="247" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">CISA KEV Feed</text>
  <text x="165" y="263" fill="#64748b" font-size="11" text-anchor="middle">Exploited CVE ID List</text>
  <text x="165" y="278" fill="#64748b" font-size="11" text-anchor="middle">Reloaded Every 30 Cycles</text>

  <rect x="300" y="225" width="260" height="65" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="430" y="247" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">NVD Specific Lookup</text>
