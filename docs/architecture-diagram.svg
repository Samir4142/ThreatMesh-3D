<svg viewBox="0 0 1500 760" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1500" height="760" fill="#ffffff"/>
  <text x="40" y="45" fill="#1e3a5f" font-size="24" font-weight="bold">ThreatMesh 3D — Final System Architecture</text>

  <!-- Legend -->
