  <text x="1022" y="363" fill="#0e7490" font-size="11" text-anchor="middle">Only Low Confidence / Weak Evidence, Dispatched Concurrently</text>
  <text x="1022" y="379" fill="#0e7490" font-size="11" text-anchor="middle">Confirm / Revise / Insufficient</text>

  <rect x="805" y="415" width="200" height="65" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="905" y="442" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">Build Attack-Path Edges</text>
  <text x="905" y="460" fill="#6d28d9" font-size="11" text-anchor="middle">Group By Shared Vendor + Product</text>

  <rect x="1040" y="415" width="200" height="65" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="1140" y="442" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">Centralized Broadcast</text>
  <text x="1140" y="460" fill="#6d28d9" font-size="11" text-anchor="middle">Single Background Task → Clients</text>

