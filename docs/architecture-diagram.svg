  <!-- Section 1: Ingestion -->
  <rect x="30" y="75" width="720" height="230" rx="10" fill="#eef4fa" stroke="#2563eb" stroke-width="2"/>
  <text x="50" y="105" fill="#1e3a5f" font-size="17" font-weight="bold">1 · Ingestion</text>

  <rect x="55" y="130" width="180" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
