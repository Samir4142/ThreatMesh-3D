  <text x="145" y="176" fill="#64748b" font-size="11" text-anchor="middle">Bootstrap Pipeline</text>

  <rect x="270" y="130" width="200" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="370" y="152" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">MITRE ATT&amp;CK STIX</text>
  <text x="370" y="170" fill="#64748b" font-size="11" text-anchor="middle">One-Time Dataset Fetch</text>
  <text x="370" y="186" fill="#64748b" font-size="11" text-anchor="middle">Techniques + Sub-Techniques</text>

  <rect x="510" y="130" width="220" height="70" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1.5"/>
