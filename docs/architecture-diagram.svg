  <rect x="805" y="130" width="200" height="65" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
  <text x="905" y="157" fill="#1e293b" font-size="13" text-anchor="middle" font-weight="bold">Merge</text>
