  <text x="1140" y="175" fill="#6d28d9" font-size="11" text-anchor="middle">Parse CPE Data</text>

  <rect x="805" y="225" width="435" height="70" rx="8" fill="#ffffff" stroke="#a78bfa" stroke-width="1.5"/>
