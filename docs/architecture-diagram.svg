  <text x="830" y="661" fill="#0e7490" font-size="11" text-anchor="middle">ReportLab, Live Snapshot</text>
  <text x="830" y="677" fill="#0e7490" font-size="11" text-anchor="middle">Summary + Threat Table</text>

