  <path d="M730 165 H805" stroke="#475569" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M560 257 H760 V178 H805" stroke="#475569" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <path d="M1100 480 V520 Q1100 535 1080 535 H330 Q300 535 300 565 V596" stroke="#16a34a" stroke-width="2" fill="none" marker-end="url(#arrow4)"/>
